<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
  <title>Add Placement Drive</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Bootstrap Icons -->
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>

    body{
        font-family:Arial,sans-serif;
        background:#f4f6f9;
        display:flex;
        justify-content:center;
        align-items:center;
        height:100vh;
        margin:0;
    }

    .container{
        width:450px;
        background:white;
        padding:30px;
        border-radius:10px;
        box-shadow:0 4px 15px rgba(0,0,0,0.15);
    }

    h2{
        text-align:center;
        margin-bottom:25px;
    }

    label{
        font-weight:bold;
        display:block;
        margin-top:15px;
    }

    input,select{
        width:100%;
        padding:10px;
        margin-top:5px;
        border:1px solid #ccc;
        border-radius:5px;
        box-sizing:border-box;
    }

    button{
        width:100%;
        padding:12px;
        margin-top:25px;
        background:#2f5bea;
        color:white;
        border:none;
        border-radius:5px;
        cursor:pointer;
        font-size:16px;
    }

    button:hover{
        background:#2146d0;
    }

  </style>

</head>

<body>

<div class="container">

  <h2>Add Placement Drive</h2>

  <form th:action="@{/save-drive}"
        th:object="${drive}"
        method="post">

    <label>ID</label>
    <input type="text" th:field="*{id}" readonly>

    <label>Drive Name</label>

    <input type="text"
           th:field="*{driveName}"
           required>

    <label>Company Name</label>

    <input type="text"
           th:field="*{companyName}"
           required>

    <label>Package (LPA)</label>

    <input type="number"
           step="0.1"
           th:field="*{packageOffered}"
           required>

    <label>Minimum CGPA</label>

    <input type="number"
           step="0.01"
           th:field="*{minimumCgpa}"
           required>

    <label>Drive Date</label>

    <input type="date"
           th:field="*{driveDate}"
           required>

    <label>Location</label>

    <input type="text"
           th:field="*{location}"
           required>

    <button type="submit">
      Save Drive
    </button>

  </form>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
