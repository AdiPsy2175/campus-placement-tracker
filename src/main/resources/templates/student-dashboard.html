<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
  <title>Student Dashboard</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">

  <div class="container">

    <a class="navbar-brand fw-bold" href="#">
      🎓 Campus Placement Tracker
    </a>

    <button class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#studentNavbar">

      <span class="navbar-toggler-icon"></span>

    </button>

    <div class="collapse navbar-collapse"
         id="studentNavbar">

      <ul class="navbar-nav ms-auto">

        <li class="nav-item">
          <a class="nav-link active"
             href="/student/dashboard">
            Dashboard
          </a>
        </li>

        <li class="nav-item">
          <a class="nav-link" href="/student/drives">
            Drives
          </a>
        </li>

        <li class="nav-item">
          <a class="nav-link" href="/student/applications">
            My Applications
          </a>
        </li>

        <li class="nav-item">
          <a class="nav-link active" href="/student/dashboard">
            Profile
          </a>
        </li>

      </ul>

      <form th:action="@{/logout}"
            method="post"
            class="ms-3">

        <button class="btn btn-light btn-sm">

          <i class="bi bi-box-arrow-right"></i>

          Logout

        </button>

      </form>

    </div>

  </div>

</nav>

<div class="container mt-5">

  <div class="card shadow">

    <div class="card-body text-center">

      <h2 class="text-primary">
        🎓 Student Dashboard
      </h2>

      <hr>

      <h4>
        Welcome <span th:text="${student.name}"></span> 👋
      </h4>

      <div class="mt-4">

        <div class="row justify-content-center mt-4">

          <div class="col-lg-8">

            <div class="card shadow border-0">

              <div class="card-body">

                <div class="text-center mb-4">

                  <i class="bi bi-person-circle"
                     style="font-size:70px;color:#0d6efd;"></i>

                  <h3 class="mt-3"
                      th:text="${student.name}"></h3>

                  <p class="text-muted">
                    Student Profile
                  </p>

                </div>

                <div class="row mb-3">

                  <div class="col-md-6">
                    <strong>📧 Email</strong>
                    <p th:text="${student.email}"></p>
                  </div>

                  <div class="col-md-6">
                    <strong>🏫 Branch</strong>
                    <p th:text="${student.branch}"></p>
                  </div>

                </div>

                <div class="row mb-3">

                  <div class="col-md-6">
                    <strong>⭐ CGPA</strong>
                    <p th:text="${student.cgpa}"></p>
                  </div>

                  <div class="col-md-6">

                    <strong>Placement Status</strong>

                    <br>

                    <span th:if="${student.placed}"
                          class="badge bg-success fs-6">

                            ✔ Placed

                        </span>

                    <span th:unless="${student.placed}"
                          class="badge bg-warning text-dark fs-6">

                            ⏳ Not Placed

                        </span>

                  </div>

                </div>

              </div>

            </div>

          </div>

        </div>

      </div>

    </div>

  </div>

</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
