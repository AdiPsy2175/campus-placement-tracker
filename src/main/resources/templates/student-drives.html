<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Available Drives</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-primary">

    <div class="container">

        <a class="navbar-brand fw-bold"
           href="/student/dashboard">

            🎓 Campus Placement Tracker

        </a>

        <form th:action="@{/logout}" method="post">

            <button class="btn btn-light btn-sm">

                <i class="bi bi-box-arrow-right"></i>

                Logout

            </button>

        </form>

    </div>

</nav>

<div class="container mt-5">

    <h2 class="mb-4">

        📋 Available Placement Drives

    </h2>

    <div class="row">

        <div class="col-md-6 mb-4"
             th:each="drive : ${drives}">

            <div class="card shadow h-100">

                <div class="card-body">

                    <h4 th:text="${drive.driveName}"></h4>

                    <p>
                        <strong>Company:</strong>
                        <span th:text="${drive.companyName}"></span>
                    </p>

                    <p>
                        <strong>Package:</strong>
                        <span th:text="${drive.packageOffered}"></span> LPA
                    </p>

                    <p>
                        <strong>Minimum CGPA:</strong>
                        <span th:text="${drive.minimumCgpa}"></span>
                    </p>

                    <p>
                        <strong>Drive Date:</strong>
                        <span th:text="${drive.driveDate}"></span>
                    </p>

                    <p>
                        <strong>Location:</strong>
                        <span th:text="${drive.location}"></span>
                    </p>

                    <div th:if="${appliedDriveIds.contains(drive.id)}">

                        <button class="btn btn-secondary w-100"
                                disabled>

                            ✓ Applied

                        </button>

                    </div>

                    <div th:unless="${appliedDriveIds.contains(drive.id)}">

                        <form th:action="@{/student/apply/{id}(id=${drive.id})}"
                              method="post">

                            <button type="submit"
                                    class="btn btn-success w-100">

                                Apply

                            </button>

                        </form>

                    </div>

                </div>

            </div>
        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
