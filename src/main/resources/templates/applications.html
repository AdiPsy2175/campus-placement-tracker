<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Applications</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>

        body{
            background:#f4f7fb;
        }

        .container-box{
            background:white;
            padding:30px;
            border-radius:12px;
            margin-top:40px;
            box-shadow:0 5px 15px rgba(0,0,0,.15);
        }

    </style>

</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">

    <div class="container-fluid">

        <a class="navbar-brand fw-bold" href="/dashboard">
            🎓 Campus Placement Tracker
        </a>

        <div class="navbar-nav ms-auto">

            <a class="nav-link" href="/dashboard">Dashboard</a>
            <a class="nav-link" href="/students">Students</a>
            <a class="nav-link" href="/companies">Companies</a>
            <a class="nav-link" href="/drives">Drives</a>

        </div>

    </div>

</nav>


<div class="container">

    <div class="container-box">

        <h2 class="mb-4">
            <i class="bi bi-file-earmark-text"></i>
            Applications
        </h2>



        <form action="/applications" method="get" class="row mb-4">

            <div class="col-md-6">

                <input
                        type="text"
                        class="form-control"
                        name="keyword"
                        placeholder="Search by student name..."
                        th:value="${keyword}">
            </div>

            <div class="col-md-2">

                <button class="btn btn-primary w-100">
                    <i class="bi bi-search"></i>
                    Search
                </button>

            </div>

            <div class="col-md-2">

                <a href="/applications"
                   class="btn btn-secondary w-100">

                    Reset

                </a>

            </div>

            <div class="col-md-2">

                <select class="form-select"
                        onchange="window.location.href=this.value">

                    <option value="/applications">
                        All Status
                    </option>

                    <option value="/applications/status?status=Pending">
                        Pending
                    </option>

                    <option value="/applications/status?status=Selected">
                        Selected
                    </option>

                    <option value="/applications/status?status=Rejected">
                        Rejected
                    </option>

                </select>

            </div>

        </form>

        <table class="table table-bordered table-hover text-center align-middle">

            <thead class="table-primary">

            <tr>

                <th>ID</th>
                <th>Student</th>
                <th>Drive</th>
                <th>Status</th>
                <th>Actions</th>

            </tr>

            </thead>

            <tbody>

            <tr th:each="app : ${applications}">

                <td th:text="${app.id}"></td>

                <td th:text="${app.studentName}"></td>

                <td th:text="${app.driveName}"></td>

                <td>

        <span class="badge bg-warning"
              th:if="${app.status == 'Pending'}">
            Pending
        </span>

                    <span class="badge bg-success"
                          th:if="${app.status == 'Selected'}">
            Selected
        </span>

                    <span class="badge bg-danger"
                          th:if="${app.status == 'Rejected'}">
            Rejected
        </span>

                </td>

                <td>

                    <a th:href="@{/applications/update-status/{id}(id=${app.id},status='Selected')}"
                       class="btn btn-success btn-sm">
                        ✓ Select
                    </a>

                    <a th:href="@{/applications/update-status/{id}(id=${app.id},status='Rejected')}"
                       class="btn btn-danger btn-sm">
                        ✗ Reject
                    </a>

                </td>

            </tr>

            </tbody>

        </table>

    </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
